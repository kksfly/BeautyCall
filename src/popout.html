<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeautyCall - Watch Party</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0c10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* 상단 헤더 바 */
    .popout-header {
      height: 48px;
      background: rgba(20, 24, 35, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-badge {
      background: #ff4757;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .sharer-name {
      font-size: 14px;
      font-weight: 600;
      color: #e4e7eb;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e4e7eb;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .header-btn:hover {
      background: rgba(255, 75, 145, 0.2);
      border-color: rgba(255, 75, 145, 0.5);
      color: #fff;
    }

    /* 비디오 뷰어 영역 */
    .popout-video-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #screenVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* 대기/종료 안내 오버레이 */
    .empty-state {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0b0c10;
      color: #718096;
    }

    .empty-icon {
      font-size: 48px;
    }

    /* 하단 플로팅 컨트롤 바 */
    .popout-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 24, 35, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .popout-video-container:hover .popout-controls {
      opacity: 1;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: #e4e7eb;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .volume-slider {
      width: 90px;
      accent-color: #ff4b91;
      height: 5px;
      cursor: pointer;
    }

    .volume-text {
      font-size: 12px;
      color: #a0aec0;
      min-width: 34px;
      text-align: right;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <!-- 상단 바 -->
  <header class="popout-header">
    <div class="header-left">
      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE
      </div>
      <div id="sharerNameText" class="sharer-name">🎬 Watch Party Stream</div>
    </div>
    <div class="header-right">
      <button id="pipBtn" class="header-btn" title="Picture in Picture">
        ⧉ PIP
      </button>
      <button id="fullscreenBtn" class="header-btn" title="Toggle Fullscreen">
        ⛶ Fullscreen
      </button>
    </div>
  </header>

  <!-- 메인 영상 뷰어 -->
  <div class="popout-video-container">
    <video id="screenVideo" autoplay playsinline></video>

    <!-- 대기 화면 -->
    <div id="emptyPlaceholder" class="empty-state">
      <div class="empty-icon">📺</div>
      <p>Waiting for screen share stream...</p>
    </div>

    <!-- 하단 컨트롤 바 (호버 시 표시) -->
    <div class="popout-controls">
      <!-- 볼륨 컨트롤 -->
      <div class="control-group">
        <button id="muteBtn" class="icon-btn" title="Mute / Unmute">🔊</button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1">
        <span id="volumePercent" class="volume-text">100%</span>
      </div>

      <div class="divider"></div>

      <!-- 화면 모드 컨트롤 -->
      <div class="control-group">
        <button id="bottomPipBtn" class="icon-btn" title="PIP Mode">⧉</button>
        <button id="bottomFsBtn" class="icon-btn" title="Fullscreen">⛶</button>
      </div>
    </div>
  </div>

  <script>
    const screenVideo = document.getElementById('screenVideo');
    const emptyPlaceholder = document.getElementById('emptyPlaceholder');
    const sharerNameText = document.getElementById('sharerNameText');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const bottomFsBtn = document.getElementById('bottomFsBtn');
    const pipBtn = document.getElementById('pipBtn');
    const bottomPipBtn = document.getElementById('bottomPipBtn');

    let currentStream = null;

    // 부모 창(window.opener)으로부터 스트림 수신 함수
    window.setStream = function(stream, sharerName = 'Participant', isSelf = false) {
      if (!stream) {
        screenVideo.srcObject = null;
        emptyPlaceholder.style.display = 'flex';
        sharerNameText.textContent = '🎬 Screen sharing ended';
        return;
      }

      currentStream = stream;
      screenVideo.srcObject = stream;
      emptyPlaceholder.style.display = 'none';

      if (isSelf) {
        // 🛡️ 공유자 본인(호스트)은 PC에서 직접 영화/영상 소리를 듣고 있으므로,
        // 팝아웃 창의 오디오를 자동 음소거하여 이중 소리(Double Audio/Echo)를 방지합니다.
        screenVideo.muted = true;
        volumeSlider.value = 0;
        muteBtn.textContent = '🔇';
        volumePercent.textContent = 'Muted';
        sharerNameText.textContent = `🎬 Your Watch Party (Muted to prevent echo)`;
      } else {
        // 상대방(시청자)은 정상적인 볼륨으로 재생
        screenVideo.muted = false;
        screenVideo.volume = 1;
        volumeSlider.value = 1;
        muteBtn.textContent = '🔊';
        volumePercent.textContent = '100%';
        sharerNameText.textContent = `🎬 ${sharerName}'s Watch Party`;
      }

      screenVideo.play().catch(e => {
        console.warn('자동 재생 정책으로 인해 클릭 대기:', e);
      });
    };

    // 초기 로드 시 부모 창에 스트림 요청
    window.addEventListener('DOMContentLoaded', () => {
      if (window.opener && typeof window.opener.getWatchPartyStream === 'function') {
        const data = window.opener.getWatchPartyStream();
        if (data && data.stream) {
          window.setStream(data.stream, data.sharerName, !!data.isSelf);
        }
      }
    });

    // 부모 창이 닫힐 때 팝아웃 창도 정리
    window.addEventListener('beforeunload', () => {
      if (window.opener && typeof window.opener.onPopoutClosed === 'function') {
        window.opener.onPopoutClosed();
      }
    });

    // 볼륨 조절
    volumeSlider.addEventListener('input', (e) => {
      const vol = parseFloat(e.target.value);
      screenVideo.volume = vol;
      screenVideo.muted = (vol === 0);
      volumePercent.textContent = `${Math.round(vol * 100)}%`;
      muteBtn.textContent = (vol === 0 || screenVideo.muted) ? '🔇' : (vol < 0.5 ? '🔉' : '🔊');
    });

    // 음소거 토글
    let lastVolume = 1;
    muteBtn.addEventListener('click', () => {
      if (screenVideo.muted || screenVideo.volume === 0) {
        screenVideo.muted = false;
        screenVideo.volume = lastVolume || 0.8;
        volumeSlider.value = screenVideo.volume;
        muteBtn.textContent = screenVideo.volume < 0.5 ? '🔉' : '🔊';
        volumePercent.textContent = `${Math.round(screenVideo.volume * 100)}%`;
      } else {
        lastVolume = screenVideo.volume;
        screenVideo.muted = true;
        volumeSlider.value = 0;
        muteBtn.textContent = '🔇';
        volumePercent.textContent = '0%';
      }
    });

    // 전체화면 토글
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('전체화면 실패:', err);
        });
      } else {
        document.exitFullscreen().catch(err => console.warn(err));
      }
    }
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    bottomFsBtn.addEventListener('click', toggleFullscreen);

    // PIP 모드 토글
    async function togglePip() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled && screenVideo.readyState >= 2) {
          await screenVideo.requestPictureInPicture();
        }
      } catch (err) {
        console.warn('PIP 모드 오류:', err);
      }
    }
    pipBtn.addEventListener('click', togglePip);
    bottomPipBtn.addEventListener('click', togglePip);
  </script>
</body>
</html>
